# nginx per nonfidartidi.it — sito statico, nessun log di accesso (coerente con la pagina Note).
# Cache: le pagine HTML si rivalidano a ogni visita (ETag -> 304 se non sono cambiate), così una nuova
# pubblicazione si vede subito. Gli asset richiamati con ?v=<hash del contenuto> (CSS e JS delle pagine, il
# build cambia l'URL a ogni modifica) si tengono un anno, immutable; gli asset senza ?v (moduli importati da
# altri moduli, font, immagini) si rivalidano a ogni visita come l'HTML.
map $arg_v $cache_asset {
  ""      "no-cache";
  default "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log off;
  error_log /dev/stderr crit;
  log_not_found off;
  absolute_redirect off;
  server_tokens off;
  charset utf-8;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Cache-Control "no-cache" always;

  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control $cache_asset;
    add_header X-Content-Type-Options nosniff always;
  }
  error_page 404 /404.html;
  location = /404.html { internal; }
}
